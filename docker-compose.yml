version: '3.8'

# ==============================================================================
# Urban Noise Intelligence Platform - Local Infrastructure
# ==============================================================================
# Services:
# - zookeeper: Apache ZooKeeper coordination service
# - kafka: Apache Kafka message broker (topics: urban-noise-events, urban-noise-predictions)
# - postgis: PostgreSQL with PostGIS extension for spatial-temporal data (Phase 6)
# ==============================================================================

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: urban_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: urban_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgis:
    image: postgis/postgis:15-3.3
    container_name: urban_postgis
    environment:
      POSTGRES_DB: urban_noise
      POSTGRES_USER: urban_admin
      POSTGRES_PASSWORD: urban_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data:
